<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>_에 대하여</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF;
    --card:#FFFFFF;
    --ink:#2B2E26;
    --ink-soft:#9AA093;
    --candy:#F0728A;
    --melon:#4FAE79;
    --melon-flesh:#F2564F;
    --sky:#5FA8CC;
    --sun:#EFB93E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px; margin:0 auto; padding:0 20px;}

  header{
    padding:56px 0 28px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .icon-drift{position:absolute; opacity:0.5; pointer-events:none;}
  .icon-drift svg{display:block;}
  .d1{top:18px; left:6%; width:34px; animation:float1 7s ease-in-out infinite;}
  .d2{top:70px; right:8%; width:28px; animation:float2 8.5s ease-in-out infinite;}
  .d3{bottom:6px; left:14%; width:26px; animation:float1 9s ease-in-out infinite 1s;}
  .d4{top:10px; right:22%; width:24px; animation:float2 6.5s ease-in-out infinite .5s;}
  @keyframes float1{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}
  @keyframes float2{0%,100%{transform:translateY(0) rotate(3deg);}50%{transform:translateY(9px) rotate(-3deg);}}

  h1{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:44px;
    margin:0;
    letter-spacing:-0.5px;
    position:relative;
    z-index:1;
  }
  #blankWord{
    display:inline-block;
    min-width:1.6em;
    border-bottom:3px solid var(--sun);
    padding:0 4px;
    transition:color .3s ease, border-color .3s ease;
  }
  .sub{
    font-size:14px;
    color:var(--ink-soft);
    margin:14px 0 0;
    line-height:1.6;
  }
  .sub b{color:var(--ink); font-weight:500;}

  .composer{
    background:var(--card);
    border-radius:20px;
    padding:16px 18px;
    box-shadow:0 6px 20px rgba(43,46,38,0.06);
    margin-top:24px;
  }
  .id-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .id-row input{
    flex:1;
    min-width:0;
    border:1px solid #ECE9DD;
    background:#FCFBF7;
    border-radius:10px;
    padding:8px 10px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink);
    outline:none;
  }
  .id-row input:focus{border-color:var(--sky);}
  .id-row input::placeholder{color:#BFC2B6;}
  textarea{
    width:100%;
    resize:none;
    border:none;
    background:transparent;
    font-family:'Noto Sans KR', sans-serif;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    min-height:60px;
    outline:none;
  }
  textarea::placeholder{color:#BFC2B6;}
  .composer-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-top:10px;
    border-top:1px solid #F0EEE4;
  }
  .count{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  button.post-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:13.5px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 20px;
    border-radius:100px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  button.post-btn:hover{background:var(--melon-flesh);}
  button.post-btn:active{transform:scale(0.95);}
  button.post-btn:disabled{opacity:0.35; cursor:default;}

  .hint{font-size:11.5px; margin:8px 2px 0;}

  main{padding:32px 0 90px;}
  .status{
    font-size:12px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    margin-bottom:18px;
    justify-content:center;
  }
  .dot{width:6px; height:6px; border-radius:50%; background:var(--melon); animation:pulse 1.8s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-family:'Gowun Batang', serif;
    font-size:16px;
    padding:70px 20px;
  }

  .board{display:flex; flex-direction:column; gap:14px;}
  .note{
    background:var(--card);
    border-radius:18px;
    padding:18px 18px 14px;
    box-shadow:0 4px 14px rgba(43,46,38,0.05);
    animation:drop .35s ease;
    position:relative;
  }
  @keyframes drop{from{opacity:0; transform:translateY(-6px);}}
  .note.new{box-shadow:0 4px 18px rgba(240,114,138,0.25); outline:2px solid var(--candy); outline-offset:-2px;}

  .note-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    border-radius:50%;
  }
  .tag svg{width:16px; height:16px;}

  .note p{
    margin:0 0 12px;
    font-size:15px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .note-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .note-foot .who{font-weight:700; color:var(--ink); font-size:13px;}
  .note-foot .meta{display:flex; align-items:center; gap:8px;}
  .edited-mark{color:var(--ink-soft);}
  .note-actions{display:flex; gap:10px;}
  .note-actions button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:11.5px;
    font-family:'Noto Sans KR', sans-serif;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .note-actions button:hover{color:var(--melon-flesh);}

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    padding-bottom:30px;
  }
</style>
</head>
<body>

<header>
  <div class="icon-drift d1" id="dfIcon1"></div>
  <div class="icon-drift d2" id="dfIcon2"></div>
  <div class="icon-drift d3" id="dfIcon3"></div>
  <div class="icon-drift d4" id="dfIcon4"></div>
  <div class="wrap">
    <h1><span id="blankWord">_</span>에 대하여</h1>
    <p class="sub"><b>딸에 대하여</b>가 그리는 평범함을 함께 이야기해요.<br>실명이 아니어도 괜찮아요, 당신의 닉네임으로 남겨주세요.</p>
  </div>
</header>

<div class="wrap">
  <div class="composer">
    <div class="id-row">
      <input id="nickInput" maxlength="20" placeholder="닉네임">
      <input id="pwInput" type="password" maxlength="20" placeholder="비밀번호 (수정·삭제용)">
    </div>
    <textarea id="input" maxlength="300" placeholder="평범하다는 건, 위로가 된다는 건 어떤 의미였나요?"></textarea>
    <div class="composer-foot">
      <span class="count" id="count">0 / 300</span>
      <button class="post-btn" id="postBtn">조용히 남기기</button>
    </div>
    <p class="hint" id="statusMsg" style="display:none;"></p>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="status"><span class="dot"></span> 지금, 여기 있는 모두의 이야기</div>
    <div id="board" class="board"></div>
  </div>
</main>

<footer>_에 대하여 — 익명 토론 공간</footer>

<script>
/* =========================================================
   Vercel KV (Upstash Redis) REST 설정
   ========================================================= */
const KV_URL = "https://vital-mayfly-149681.upstash.io";
const KV_TOKEN = "gQAAAAAAAkixAAIgcDIwZWNlOWU0Y2YxZjU0M2FjYmNlZGZmNzI3M2Y5OWJmYw";
const HASH_KEY = "about_blank_posts";

async function kvCommand(command){
  const res = await fetch(KV_URL, {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${KV_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(command)
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.result;
}

/* ---------- icon library ---------- */
const ICONS = {
  candy: {
    color:'var(--candy)', bg:'#FBE4E9',
    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5.5"/>
      <path d="M4 8 L1 6 M4 16 L1 18 M20 8 L23 6 M20 16 L23 18"/>
    </svg>`
  },
  melon: {
    color:'var(--melon)', bg:'#E3F2E7',
    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12 A9 9 0 0 1 21 12 Z"/>
      <circle cx="9" cy="9.5" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="9.5" r="0.6" fill="currentColor" stroke="none"/>
    </svg>`
  },
  rainbow: {
    color:'var(--sky)', bg:'#E4F1F7',
    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M2 18 A10 10 0 0 1 22 18"/>
      <path d="M6 18 A6 6 0 0 1 18 18"/>
    </svg>`
  },
  shoe: {
    color:'var(--sun)', bg:'#FBF0DA',
    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 17 h19 a1 1 0 0 0 1-1 c0-3-2-4-4-5 -2-1-3-1-4-3 l-2 1 1 2 -3 1 -1-2 -3 1 v4 a2 2 0 0 0 2 2 Z"/>
      <path d="M6 12 v4"/>
    </svg>`
  }
};
const ICON_KEYS = Object.keys(ICONS);
const BLANK_WORDS = ['평범','위로','가족','당신','오늘','거리','침묵','다정함','하윤경'];

function renderIconInto(el, key){
  el.innerHTML = ICONS[key].svg;
  el.style.color = ICONS[key].color;
}
['dfIcon1','dfIcon2','dfIcon3','dfIcon4'].forEach((id,i)=>{
  renderIconInto(document.getElementById(id), ICON_KEYS[i % ICON_KEYS.length]);
});

/* ---------- cycling blank title ---------- */
let wordIdx = 0;
const blankEl = document.getElementById('blankWord');
setInterval(()=>{
  wordIdx = (wordIdx+1) % BLANK_WORDS.length;
  const key = ICON_KEYS[wordIdx % ICON_KEYS.length];
  blankEl.style.color = ICONS[key].color;
  blankEl.style.borderColor = ICONS[key].color;
  blankEl.textContent = BLANK_WORDS[wordIdx];
}, 2600);

/* ---------- board logic ---------- */
let knownIds = new Set();
let firstLoad = true;
let postsCache = {}; // id -> post, used for password checks

const boardEl = document.getElementById('board');
const inputEl = document.getElementById('input');
const nickEl = document.getElementById('nickInput');
const pwEl = document.getElementById('pwInput');
const countEl = document.getElementById('count');
const postBtn = document.getElementById('postBtn');
const statusMsgEl = document.getElementById('statusMsg');

function hashPick(id, arr){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}

function timeAgo(ts){
  const diff = Math.floor((Date.now() - ts) / 1000);
  if(diff < 10) return '방금 전';
  if(diff < 60) return diff + '초 전';
  if(diff < 3600) return Math.floor(diff/60) + '분 전';
  if(diff < 86400) return Math.floor(diff/3600) + '시간 전';
  return Math.floor(diff/86400) + '일 전';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showStatus(msg, isError){
  statusMsgEl.textContent = msg;
  statusMsgEl.style.color = isError ? 'var(--melon-flesh)' : 'var(--ink-soft)';
  statusMsgEl.style.display = msg ? 'block' : 'none';
}

function render(posts){
  if(posts.length === 0){
    boardEl.innerHTML = '<div class="empty">아직 아무 말도 없어요.<br>가장 평범한 문장부터 남겨보세요.</div>';
    return;
  }
  boardEl.innerHTML = posts.map(p => {
    const key = hashPick(p.id, ICON_KEYS);
    const isNew = !firstLoad && !knownIds.has(p.id);
    return `<div class="note${isNew ? ' new' : ''}" data-id="${p.id}">
      <div class="note-top">
        <span class="tag" style="background:${ICONS[key].bg}; color:${ICONS[key].color}">${ICONS[key].svg}</span>
        <span class="who">${escapeHtml(p.nick)}</span>
      </div>
      <p>${escapeHtml(p.text)}</p>
      <div class="note-foot">
        <span class="meta">${p.edited ? '<span class="edited-mark">(수정됨)</span>' : ''}<span>${timeAgo(p.ts)}</span></span>
        <span class="note-actions">
          <button data-action="edit" data-id="${p.id}">수정</button>
          <button data-action="delete" data-id="${p.id}">삭제</button>
        </span>
      </div>
    </div>`;
  }).join('');
  posts.forEach(p => knownIds.add(p.id));
  firstLoad = false;
}

/* ---------- KV helpers ---------- */
/* posts are stored as a Redis hash: field = post id, value = JSON string of the post.
   This lets many people post/edit/delete at the same time without overwriting
   each other (unlike storing the whole list under one key). */
async function fetchPosts(){
  try{
    const raw = await kvCommand(['HGETALL', HASH_KEY]); // [field1, value1, field2, value2, ...]
    const posts = [];
    postsCache = {};
    if(Array.isArray(raw)){
      for(let i=0; i<raw.length; i+=2){
        try{
          const post = JSON.parse(raw[i+1]);
          posts.push(post);
          postsCache[post.id] = post;
        }catch(e){ /* skip malformed entry */ }
      }
    }
    posts.sort((a,b) => b.ts - a.ts);
    return posts;
  }catch(e){
    showStatus('목록을 불러오지 못했어요: ' + e.message, true);
    return [];
  }
}

async function savePost(post){
  await kvCommand(['HSET', HASH_KEY, post.id, JSON.stringify(post)]);
}
async function deletePostKV(id){
  await kvCommand(['HDEL', HASH_KEY, id]);
}

async function loadPosts(){
  const posts = await fetchPosts();
  render(posts);
}

async function submitPost(){
  const text = inputEl.value.trim();
  const nick = nickEl.value.trim();
  const pw = pwEl.value;
  if(!nick){ showStatus('닉네임을 입력해주세요.', true); nickEl.focus(); return; }
  if(!pw){ showStatus('나중에 수정·삭제할 때 필요한 비밀번호를 입력해주세요.', true); pwEl.focus(); return; }
  if(!text){ inputEl.focus(); return; }

  postBtn.disabled = true;
  showStatus('', false);
  try{
    const id = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    await savePost({
      id,
      nick: nick.slice(0,20),
      pw: pw,
      text: text.slice(0,300),
      ts: Date.now(),
      edited: false
    });
    inputEl.value = '';
    countEl.textContent = '0 / 300';
    await loadPosts();
  }catch(e){
    showStatus('게시에 실패했어요: ' + (e && e.message ? e.message : '알 수 없는 오류'), true);
  }finally{
    postBtn.disabled = false;
  }
}

async function handleEdit(id){
  const target = postsCache[id];
  if(!target){ alert('이미 지워진 글이에요.'); loadPosts(); return; }
  const pw = prompt('비밀번호를 입력하세요');
  if(pw === null) return;
  if(pw !== target.pw){ alert('비밀번호가 일치하지 않아요.'); return; }
  const newText = prompt('내용을 수정하세요', target.text);
  if(newText === null) return;
  const trimmed = newText.trim();
  if(!trimmed) return;
  try{
    target.text = trimmed.slice(0,300);
    target.edited = true;
    await savePost(target);
    await loadPosts();
  }catch(e){
    alert('수정에 실패했어요: ' + e.message);
  }
}

async function handleDelete(id){
  const target = postsCache[id];
  if(!target){ alert('이미 지워진 글이에요.'); loadPosts(); return; }
  const pw = prompt('비밀번호를 입력하세요');
  if(pw === null) return;
  if(pw !== target.pw){ alert('비밀번호가 일치하지 않아요.'); return; }
  if(!confirm('이 글을 삭제할까요?')) return;
  try{
    await deletePostKV(id);
    await loadPosts();
  }catch(e){
    alert('삭제에 실패했어요: ' + e.message);
  }
}

boardEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.getAttribute('data-id');
  if(btn.getAttribute('data-action') === 'edit') handleEdit(id);
  else handleDelete(id);
});

inputEl.addEventListener('input', () => {
  countEl.textContent = inputEl.value.length + ' / 300';
});
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    submitPost();
  }
});
postBtn.addEventListener('click', submitPost);

loadPosts();
setInterval(loadPosts, 3000);
</script>

</body>
</html>
