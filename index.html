<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>_에 대하여</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF;
    --card:#FFFFFF;
    --ink:#2B2E26;
    --ink-soft:#9AA093;
    --candy:#F0728A;
    --melon:#4FAE79;
    --melon-flesh:#F2564F;
    --sky:#5FA8CC;
    --sun:#EFB93E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px; margin:0 auto; padding:0 20px;}
  main .wrap{max-width:860px;}

  header{
    padding:26px 0 14px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .icon-drift{position:absolute; opacity:0.5; pointer-events:none;}
  .icon-drift svg{display:block;}
  .d1{top:10px; left:5%; width:26px; animation:float1 7s ease-in-out infinite;}
  .d2{top:44px; right:6%; width:22px; animation:float2 8.5s ease-in-out infinite;}
  .d3{bottom:4px; left:13%; width:20px; animation:float1 9s ease-in-out infinite 1s;}
  .d4{top:6px; right:21%; width:19px; animation:float2 6.5s ease-in-out infinite .5s;}
  @keyframes float1{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}
  @keyframes float2{0%,100%{transform:translateY(0) rotate(3deg);}50%{transform:translateY(9px) rotate(-3deg);}}

  h1{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:34px;
    margin:0;
    letter-spacing:-0.5px;
    position:relative;
    z-index:1;
  }
  #blankWord{
    display:inline-block;
    border-bottom:3px solid var(--sun);
    padding:0 4px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    vertical-align:bottom;
    transition:width .45s cubic-bezier(.4,0,.2,1), border-color .45s ease;
  }
  #blankWord .word{
    display:inline-block;
    transition:opacity .22s ease, transform .22s ease;
  }
  #blankWord .word.out{opacity:0; transform:translateY(-8px);}
  #wordMeasure{
    position:absolute;
    visibility:hidden;
    white-space:nowrap;
    padding:0 4px;
    pointer-events:none;
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:-0.5px;
  }
  .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:7px 0 0;
    line-height:1.5;
  }
  .sub b{color:var(--ink); font-weight:500;}

  .composer{
    background:var(--card);
    border-radius:14px;
    padding:7px 11px;
    box-shadow:0 4px 14px rgba(43,46,38,0.06);
    margin-top:9px;
  }
  .id-row{
    display:flex;
    gap:6px;
    margin-bottom:5px;
  }
  .id-row input{
    flex:1;
    min-width:0;
    border:1px solid #ECE9DD;
    background:#FCFBF7;
    border-radius:8px;
    padding:4px 8px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:11.5px;
    color:var(--ink);
    outline:none;
  }
  .id-row input:focus{border-color:var(--sky);}
  .id-row input::placeholder{color:#BFC2B6;}
  textarea{
    width:100%;
    resize:none;
    border:none;
    background:transparent;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14px;
    line-height:1.45;
    color:var(--ink);
    min-height:22px;
    outline:none;
  }
  textarea::placeholder{color:#BFC2B6;}
  .composer-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:3px;
    padding-top:4px;
    border-top:1px solid #F0EEE4;
  }
  .count{font-size:10.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  button.post-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:12px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:5px 14px;
    border-radius:100px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  button.post-btn:hover{background:var(--melon-flesh);}
  button.post-btn:active{transform:scale(0.95);}
  button.post-btn:disabled{opacity:0.35; cursor:default;}

  .hint{font-size:11.5px; margin:6px 2px 0;}

  main{padding:16px 0 60px;}
  .status{
    font-size:11.5px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
    margin-bottom:11px;
    justify-content:center;
  }
  .dot{width:6px; height:6px; border-radius:50%; background:var(--melon); animation:pulse 1.8s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-family:'Gowun Batang', serif;
    font-size:16px;
    padding:70px 20px;
  }

  .board{display:flex; flex-direction:column; gap:14px;}

  /* ---- chat bubble layout ---- */
  .note{
    display:flex;
    align-items:flex-end;
    gap:10px;
    max-width:82%;
    animation:drop .4s cubic-bezier(.2,.8,.3,1);
    position:relative;
  }
  .note.left{align-self:flex-start; flex-direction:row;}
  .note.right{align-self:flex-end; flex-direction:row-reverse;}
  @keyframes drop{from{opacity:0; transform:translateY(10px) scale(.97);}}

  .tag{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:38px; height:38px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(43,46,38,0.10);
  }
  .tag img{width:100%; height:100%; object-fit:cover; display:block;}

  .bubble-col{display:flex; flex-direction:column; min-width:0;}
  .note.right .bubble-col{align-items:flex-end;}

  .who{
    font-weight:700;
    color:var(--ink);
    font-size:13px;
    margin-bottom:3px;
    padding:0 4px;
  }

  .bubble{
    background:var(--card);
    border-radius:18px;
    padding:11px 15px;
    box-shadow:0 4px 14px rgba(43,46,38,0.06);
    position:relative;
  }
  .note.left .bubble{border-bottom-left-radius:5px;}
  .note.right .bubble{border-bottom-right-radius:5px; background:#EAF4EC;}

  .note.new .bubble{
    box-shadow:0 4px 20px rgba(240,114,138,0.28);
    outline:2px solid var(--candy);
    outline-offset:-2px;
  }

  .bubble p{
    margin:0;
    font-size:16px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .note-foot{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
    padding:0 4px;
  }
  .note.right .note-foot{flex-direction:row-reverse;}
  .edited-mark{color:var(--ink-soft);}
  .note-actions{display:flex; gap:9px;}
  .note-actions button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:11px;
    font-family:'Noto Sans KR', sans-serif;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .note-actions button:hover{color:var(--melon-flesh);}

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    padding-bottom:18px;
  }
  .with-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-top:10px;
  }
  .with-row span{font-family:'Gowun Batang', serif;}
  .with-row img{height:22px; width:auto; display:block;}
</style>
</head>
<body>

<header>
  <div class="icon-drift d1" id="dfIcon1"></div>
  <div class="icon-drift d2" id="dfIcon2"></div>
  <div class="icon-drift d3" id="dfIcon3"></div>
  <div class="icon-drift d4" id="dfIcon4"></div>
  <div class="wrap">
    <h1><span id="blankWord"><span class="word">_</span></span>에 대하여</h1>
    <span id="wordMeasure"></span>
    <p class="sub"><b>딸에 대하여</b>가 그리는 평범함을 함께 이야기해요.<br>실명이 아니어도 괜찮아요, 당신의 닉네임으로 남겨주세요.</p>
  </div>
</header>

<div class="wrap">
  <div class="composer">
    <div class="id-row">
      <input id="nickInput" maxlength="20" placeholder="닉네임">
      <input id="pwInput" type="password" maxlength="20" placeholder="비밀번호 (수정·삭제용)">
    </div>
    <textarea id="input" maxlength="300" placeholder="평범하다는 건, 함께한다는 건 어떤 의미였나요?"></textarea>
    <div class="composer-foot">
      <span class="count" id="count">0 / 300</span>
      <button class="post-btn" id="postBtn">조용히 남기기</button>
    </div>
    <p class="hint" id="statusMsg" style="display:none;"></p>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="status"><span class="dot"></span> 지금, 여기 있는 모두의 이야기</div>
    <div id="board" class="board"></div>
  </div>
</main>

    method: 'POST',

='
];
const BLANK_WORDS = ['평범','위로','가족','당신','오늘','함께','사랑','다정함','하윤경'];

function renderIconInto(el, key){
  el.innerHTML = ICONS[key].svg;
  el.style.color = ICONS[key].color;
}
['dfIcon1','dfIcon2','dfIcon3','dfIcon4'].forEach((id,i)=>{
  renderIconInto(document.getElementById(id), ICON_KEYS[i % ICON_KEYS.length]);
});

/* ---------- cycling blank title ---------- */
let wordIdx = 0;
const blankEl = document.getElementById('blankWord');
const measureEl = document.getElementById('wordMeasure');
let wordSpan = blankEl.querySelector('.word');

function measureWidth(text){
  measureEl.textContent = text;
  return measureEl.getBoundingClientRect().width;
}

/* set the starting width so the very first transition is smooth too */
function initBlank(){
  blankEl.style.width = measureWidth(BLANK_WORDS[0]) + 'px';
  wordSpan.textContent = BLANK_WORDS[0];
  const key0 = ICON_KEYS[0];
  blankEl.style.color = ICONS[key0].color;
  blankEl.style.borderColor = ICONS[key0].color;
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(initBlank);
}else{
  window.addEventListener('load', initBlank);
}

setInterval(()=>{
  wordIdx = (wordIdx+1) % BLANK_WORDS.length;
  const next = BLANK_WORDS[wordIdx];
  const key = ICON_KEYS[wordIdx % ICON_KEYS.length];

  // width animates first, in parallel with the fade — no layout jump
  blankEl.style.width = measureWidth(next) + 'px';
  blankEl.style.borderColor = ICONS[key].color;
  wordSpan.classList.add('out');

  setTimeout(()=>{
    wordSpan.textContent = next;
    blankEl.style.color = ICONS[key].color;
    wordSpan.classList.remove('out');
  }, 220);
}, 2800);

/* ---------- board logic ---------- */
let knownIds = new Set();
let firstLoad = true;
let postsCache = {}; // id -> post, used for password checks

const boardEl = document.getElementById('board');
const inputEl = document.getElementById('input');
const nickEl = document.getElementById('nickInput');
const pwEl = document.getElementById('pwInput');
const countEl = document.getElementById('count');
const postBtn = document.getElementById('postBtn');
const statusMsgEl = document.getElementById('statusMsg');

function hashPick(id, arr){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}

function timeAgo(ts){
  const diff = Math.floor((Date.now() - ts) / 1000);
  if(diff < 10) return '방금 전';
  if(diff < 60) return diff + '초 전';
  if(diff < 3600) return Math.floor(diff/60) + '분 전';
  if(diff < 86400) return Math.floor(diff/3600) + '시간 전';
  return Math.floor(diff/86400) + '일 전';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showStatus(msg, isError){
  statusMsgEl.textContent = msg;
  statusMsgEl.style.color = isError ? 'var(--melon-flesh)' : 'var(--ink-soft)';
  statusMsgEl.style.display = msg ? 'block' : 'none';
}

const renderedEls = new Map(); // id -> DOM element, kept across polls so unchanged posts never re-render

function noteInnerHtml(p){
  const cat = hashPick(p.id, CATS);
  return `<span class="tag"><img src="${cat}" alt="작성자 아이콘"></span>
      <div class="bubble-col">
        <span class="who">${escapeHtml(p.nick)}</span>
        <div class="bubble"><p>${escapeHtml(p.text)}</p></div>
        <div class="note-foot">
          ${p.edited ? '<span class="edited-mark">(수정됨)</span>' : ''}<span>${timeAgo(p.ts)}</span>
          <span class="note-actions">
            <button data-action="edit" data-id="${p.id}">수정</button>
            <button data-action="delete" data-id="${p.id}">삭제</button>
          </span>
        </div>
      </div>`;
}

/* alternate sides deterministically so a post always stays on the same side */
function sideFor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return (h % 2 === 0) ? 'left' : 'right';
}

function render(posts){
  if(posts.length === 0){
    boardEl.innerHTML = '<div class="empty">아직 아무 말도 없어요.<br>가장 평범한 문장부터 남겨보세요.</div>';
    renderedEls.clear();
    return;
  }
  if(boardEl.querySelector('.empty')) boardEl.innerHTML = '';

  const currentIds = new Set(posts.map(p => p.id));

  // remove notes for posts that no longer exist (deleted)
  renderedEls.forEach((el, id) => {
    if(!currentIds.has(id)){
      el.remove();
      renderedEls.delete(id);
    }
  });

  // add or update notes, keeping existing DOM nodes (and their timers/state) untouched when unchanged
  posts.forEach((p, idx) => {
    let el = renderedEls.get(p.id);
    const sig = p.text + '|' + p.edited + '|' + p.nick;
    if(!el){
      el = document.createElement('div');
      el.className = 'note ' + sideFor(p.id) + (firstLoad ? '' : ' new');
      el.dataset.id = p.id;
      el.dataset.sig = sig;
      el.innerHTML = noteInnerHtml(p);
      renderedEls.set(p.id, el);
      if(!firstLoad){
        setTimeout(() => el.classList.remove('new'), 4000);
      }
    } else if(el.dataset.sig !== sig){
      el.dataset.sig = sig;
      el.innerHTML = noteInnerHtml(p);
    }
    // keep DOM order in sync with sort order (newest first) without rebuilding nodes
    const refNode = boardEl.children[idx];
    if(refNode !== el){
      boardEl.insertBefore(el, refNode || null);
    }
  });

  posts.forEach(p => knownIds.add(p.id));
  firstLoad = false;
}

/* ---------- KV helpers ---------- */
/* posts are stored as a Redis hash: field = post id, value = JSON string of the post.
   This lets many people post/edit/delete at the same time without overwriting
   each other (unlike storing the whole list under one key). */
async function fetchPosts(){
  try{
    const raw = await kvCommand(['HGETALL', HASH_KEY]); // [field1, value1, field2, value2, ...]
    const posts = [];
    postsCache = {};
    if(Array.isArray(raw)){
      for(let i=0; i<raw.length; i+=2){
        try{
          const post = JSON.parse(raw[i+1]);
          posts.push(post);
          postsCache[post.id] = post;
        }catch(e){ /* skip malformed entry */ }
      }
    }
    posts.sort((a,b) => b.ts - a.ts);
    return posts;
  }catch(e){
    showStatus('목록을 불러오지 못했어요: ' + e.message, true);
    return [];
  }
}

async function savePost(post){
  await kvCommand(['HSET', HASH_KEY, post.id, JSON.stringify(post)]);
}
async function deletePostKV(id){
  await kvCommand(['HDEL', HASH_KEY, id]);
}

async function loadPosts(){
  const posts = await fetchPosts();
  render(posts);
}

async function submitPost(){
  const text = inputEl.value.trim();
  const nick = nickEl.value.trim();
  const pw = pwEl.value;
  if(!nick){ showStatus('닉네임을 입력해주세요.', true); nickEl.focus(); return; }
  if(!pw){ showStatus('나중에 수정·삭제할 때 필요한 비밀번호를 입력해주세요.', true); pwEl.focus(); return; }
  if(!text){ inputEl.focus(); return; }

  postBtn.disabled = true;
  showStatus('', false);
  try{
    const id = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    await savePost({
      id,
      nick: nick.slice(0,20),
      pw: pw,
      text: text.slice(0,300),
      ts: Date.now(),
      edited: false
    });
    inputEl.value = '';
    countEl.textContent = '0 / 300';
    await loadPosts();
  }catch(e){
    showStatus('게시에 실패했어요: ' + (e && e.message ? e.message : '알 수 없는 오류'), true);
  }finally{
    postBtn.disabled = false;
  }
}

async function handleEdit(id){
  const target = postsCache[id];
  if(!target){ alert('이미 지워진 글이에요.'); loadPosts(); return; }
  const pw = prompt('비밀번호를 입력하세요 (작성자 비밀번호 또는 관리자 비밀번호)');
  if(pw === null) return;
  if(pw !== target.pw && pw !== ADMIN_PASSWORD){ alert('비밀번호가 일치하지 않아요.'); return; }
  const newText = prompt('내용을 수정하세요', target.text);
  if(newText === null) return;
  const trimmed = newText.trim();
  if(!trimmed) return;
  try{
    target.text = trimmed.slice(0,300);
    target.edited = true;
    await savePost(target);
    await loadPosts();
  }catch(e){
    alert('수정에 실패했어요: ' + e.message);
  }
}

async function handleDelete(id){
  const target = postsCache[id];
  if(!target){ alert('이미 지워진 글이에요.'); loadPosts(); return; }
  const pw = prompt('비밀번호를 입력하세요 (작성자 비밀번호 또는 관리자 비밀번호)');
  if(pw === null) return;
  if(pw !== target.pw && pw !== ADMIN_PASSWORD){ alert('비밀번호가 일치하지 않아요.'); return; }
  if(!confirm('이 글을 삭제할까요?')) return;
  try{
    await deletePostKV(id);
    await loadPosts();
  }catch(e){
    alert('삭제에 실패했어요: ' + e.message);
  }
}

boardEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.getAttribute('data-id');
  if(btn.getAttribute('data-action') === 'edit') handleEdit(id);
  else handleDelete(id);
});

inputEl.addEventListener('input', () => {
  countEl.textContent = inputEl.value.length + ' / 300';
});
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    submitPost();
  }
});
postBtn.addEventListener('click', submitPost);

loadPosts();
setInterval(loadPosts, 5000);
</script>
